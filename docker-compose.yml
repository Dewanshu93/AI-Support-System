# Local stack: web (Next.js), api (Express), mongodb (structured data and
# chunk text) and qdrant (dense + sparse BM25 vector search; ADR-004).
services:
  mongodb:
    image: mongo:8.0
    hostname: mongodb
    ports:
      - '27017:27017'
    volumes:
      - mongodb-data:/data/db
      - mongodb-config:/data/configdb

  qdrant:
    image: qdrant/qdrant:v1.19.1
    hostname: qdrant
    ports:
      - '6333:6333'
    volumes:
      - qdrant-data:/qdrant/storage

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    # MongoDB may still be starting; the API exits if it cannot connect.
    restart: on-failure
    env_file:
      - path: .env
        required: false
    environment:
      API_PORT: '4000'
      MONGODB_URI: mongodb://mongodb:27017/servicedesk?directConnection=true
      QDRANT_URL: http://qdrant:6333
      WEB_ORIGIN: http://localhost:3000
    ports:
      - '4000:4000'
    depends_on:
      - mongodb
      - qdrant

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:4000
    ports:
      - '3000:3000'
    depends_on:
      - api

volumes:
  mongodb-data:
  mongodb-config:
  qdrant-data:
