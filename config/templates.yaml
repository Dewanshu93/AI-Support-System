# Fixed (non-LLM) replies. {placeholders} are filled by code.
version: 1
templates:
  out_of_scope: >-
    I can help with IT and HR questions about working here, but that one is outside what I can
    answer. Try asking about devices, software, access, leave, benefits or company policy.
  sensitive_handoff: >-
    Thank you for telling me. This is something a person in HR should handle directly and in
    confidence, so I won't give automated advice on it. You can contact {contact} at any time.
    Would you like HR to contact you privately?
  sensitive_contact: the HR confidential line (hr-confidential@example.com)
  withdrawn_answer: >-
    I couldn't back that answer up with the policy documents, so I've withdrawn it rather than
    risk giving you wrong information. Would you like me to raise a ticket with the {domain} team?
  ticket_confirmed: >-
    Your ticket {ticketHumanId} has been created and sent to the {queueLabel} queue. You can
    follow it under My tickets.
  generic_error: >-
    Something went wrong on our side while handling that message. Please try again in a moment.
  clarify_generic: >-
    Could you tell me a bit more so I can help? For example, which device, system or policy is
    this about, and what have you already tried?
  resolution_declined: >-
    Sorry that didn't solve it. Would you like me to raise a ticket so a person can help?
  ticket_draft_ready: >-
    I've prepared a ticket for the {queueLabel} team. Check the details below and confirm to send
    it.
  ticket_fields_question: >-
    To raise your ticket I need a little more detail: {fields}. Could you tell me?
  ticket_cancelled: >-
    No problem, I haven't raised a ticket. Ask me anything else whenever you need.
  ticket_linked: >-
    I've added this to your existing ticket {ticketHumanId} instead of opening a new one. You can
    follow it under My tickets.
  restricted_case_summary: Confidential HR contact request
  restricted_case_description: >-
    The employee asked HR to contact them privately about a sensitive matter. The conversation is
    not attached; contact the employee directly.
  # Escalation email (UC-07, ADR-017). Code assembles the body; figures come from records.
  email_greeting: Hello {queueLabel} team,
  email_sign_off: |-
    Regards,
    {employeeName}
    {department}
  email_request_lop: >-
    Please review the Loss of Pay deduction for {dates} and correct it if it was applied in error.
  email_request_default: Please look into this and let me know the next steps.
  email_records_unavailable: My pay records could not be read when this email was drafted.
  email_draft_ready: >-
    I've prepared a request and an email to the {queueLabel} team. Check both below and edit
    anything you need. Nothing is sent until you press Send.
  email_recorded: >-
    Your email to the {queueLabel} team is in the outbox and linked to {ticketHumanId}. Delivery
    is simulated in this prototype.
  email_failed: >-
    Your request {ticketHumanId} was created, but the email could not be delivered. The team can
    still see your request.
