# Working-time rules for timesheets and the holiday calendar (UC-01, ADR-015).
# Holiday dates must match the public-holiday policies in corpus/hr.
version: 1
timesheet:
  # A working day is complete when at least this many hours are logged.
  requiredHoursPerDay: 8
  # Upper bound for one day across all projects.
  maxHoursPerDay: 12
  # Entries are in steps of this many hours (0.5 = half hours).
  hourStep: 0.5
  # How far back an employee may log or change hours (late entries for LOP review).
  maxBackDays: 60
# Payroll cutoff (corpus hr-loss-of-pay; UC-12, ADR-024): a working day with no timesheet and no
# attendance record (or marked absent) at its cutoff is treated as Loss of Pay.
payroll:
  # The cutoff for a day is this many working days after it; hours logged on the cutoff day count.
  cutoffWorkingDays: 5
  # "Needs your attention" marks a Loss of Pay risk urgent when this few working days are left.
  urgentWithinWorkingDays: 2
# Leave types employees book themselves (UC-11, ADR-025). Numbers must match the leave policies
# in corpus/hr (annual leave US/UK, sick leave US/UK, casual leave). The leave year is the
# calendar year; seniority steps (US 20 days, UK 27 days after 5 years) are not modelled.
leave:
  types:
    annual:
      label: Annual leave
      entitlement: { US: 15, UK: 25 }
      needsApproval: true
      # Longer leave needs the department head: raise an HR request instead.
      maxConsecutiveDays: 15
      # More than `overDays` working days → at least `workingDays` working days' notice.
      notice:
        US: { overDays: 3, workingDays: 10 }
        UK: { overDays: 4, workingDays: 20 }
    sick:
      label: Sick leave
      entitlement: { US: 10, UK: 20 }
      # Recorded, not approved: the manager is told on the day.
      needsApproval: false
      # Recorded for today or up to this many days back, never ahead.
      maxBackDays: 30
      # A doctor's note is needed after this many consecutive days.
      certificateAfterDays: { US: 3, UK: 7 }
    casual:
      label: Casual leave
      entitlement: { US: 6, UK: 6 }
      needsApproval: true
      maxConsecutiveDays: 2
      notice:
        US: { overDays: 0, workingDays: 1 }
        UK: { overDays: 0, workingDays: 1 }
  # Unused annual leave that carries into the next year (corpus annual leave policies).
  carryOverDays: 5
  # "Needs your attention" reminds about unused annual leave from this day of the year (MM-DD).
  expiryReminderFrom: '10-01'
holidays:
  US:
    - { date: '2026-01-01', name: "New Year's Day" }
    - { date: '2026-01-19', name: 'Martin Luther King Jr. Day' }
    - { date: '2026-02-16', name: "Presidents' Day" }
    - { date: '2026-05-25', name: 'Memorial Day' }
    - { date: '2026-06-19', name: 'Juneteenth' }
    - { date: '2026-07-03', name: 'Independence Day (observed)' }
    - { date: '2026-09-07', name: 'Labor Day' }
    - { date: '2026-11-26', name: 'Thanksgiving Day' }
    - { date: '2026-11-27', name: 'Day after Thanksgiving' }
    - { date: '2026-12-25', name: 'Christmas Day' }
  UK:
    - { date: '2026-01-01', name: "New Year's Day" }
    - { date: '2026-04-03', name: 'Good Friday' }
    - { date: '2026-04-06', name: 'Easter Monday' }
    - { date: '2026-05-04', name: 'Early May bank holiday' }
    - { date: '2026-05-25', name: 'Spring bank holiday' }
    - { date: '2026-08-31', name: 'Summer bank holiday' }
    - { date: '2026-12-25', name: 'Christmas Day' }
    - { date: '2026-12-28', name: 'Boxing Day (substitute)' }
