# LLM provider and models. Switching provider is a config-only change.
# Gemini IDs verified by calling them on 2026-10-05 (W1-09): the 2.5 models are
# closed to new API keys and no Pro model has quota on the current key, so the
# quality tier uses the newest Flash. OpenRouter IDs verified in its catalogue.
# `npm run llm:smoke` re-checks every provider with a key.
# Changing the embedding model or dimension requires a full re-index and a
# new vector index (D-2).
version: 1
chat:
  provider: gemini # gemini | openrouter | ollama
  # ADR-018: when a model is out of quota or credit, rejects its key or is
  # unreachable, the API server tries the provider's fast model (for quality
  # calls), then these providers in order. A provider without its key or URL
  # in .env is left out. Evals and llm:smoke ignore this list.
  fallbacks: [openrouter, ollama]
  models:
    gemini:
      fast: gemini-3.1-flash-lite
      quality: gemini-3.8-flash
    openrouter:
      fast: google/gemini-3.1-flash-lite
      quality: google/gemini-3.8-flash
    # Ollama on the LAN host (OLLAMA_BASE_URL): Dolphin 3 (Llama 3.1 8B, Q4, 131K
    # context), `ollama pull dolphin3`. Verified 2026-10-12: valid JSON output,
    # about 14 s warm for a short prompt, about 2 min when the model first loads.
    # A last resort when Gemini and OpenRouter are out of quota or credit.
    ollama:
      fast: dolphin3:latest
      quality: dolphin3:latest
embeddings:
  provider: gemini # D-2: Gemini embeddings, configured separately from chat
  model: gemini-embedding-001
  dimension: 768

# Applied to every chat and embedding call: abort after timeoutMs, then retry
# with exponential backoff (rate limits, timeouts, 5xx) up to maxRetries.
# maxOutputTokens caps every chat response.
call:
  timeoutMs: 30000
  # The local model on CPU needs longer per attempt (API server's fallback chain only).
  providerTimeoutMs: { ollama: 120000 }
  maxRetries: 2
  maxOutputTokens: 2048

# USD per 1M tokens, used for trace and eval cost reporting. Chat prices are
# from the OpenRouter model catalogue (2026-10-05), which passes Google's list
# price through; the embedding price is not yet verified.
costs:
  gemini-3.1-flash-lite: { input: 0.25, output: 1.50 }
  gemini-3.8-flash: { input: 0.75, output: 3.75 }
  google/gemini-3.1-flash-lite: { input: 0.25, output: 1.50 }
  google/gemini-3.8-flash: { input: 0.75, output: 3.75 }
  gemini-embedding-001: { input: 0.15 }
  dolphin3:latest: { input: 0, output: 0 } # local
